+0033,U+0034,U+0035,U+0036,U+0037,U+0038,U+003A,U+0041,U+0042,U+0043,U+0044,U+0045,U+0046,U+0047,U+004A,U+004B,U+004C,U+004F,U+0050,U+0051,U+0052,U+0053,U+0054,U+0055,U+0056,U+0057,U+0058,U+0059,U+005A,U+006D,U+AE30,U+B2E4,U+C0AC,U+C2A4,U+C2DC,U+C9C0,U+D558;}
/* 한 장의 도면 → 밤의 전시장. 작품 포스터의 차콜·옐로·연두를 빌린 단일 톤 무대 위 세로 타이포 */
:root{
  --night:#0b121b; --ink:#efe6d6; --accent:#e2bd57; --lime:#cfdc4a;
  --line:#dfe9f7; --glass:rgba(16,15,14,.5);
  --f-disp:'Hahmlet','Apple SD Gothic Neo','Noto Serif KR',serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--night);overflow:hidden;overscroll-behavior:none}
body{-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:var(--f-disp);-webkit-text-size-adjust:100%}
#app{position:fixed;inset:0;outline:none;cursor:pointer;touch-action:none}
#app.done{cursor:grab}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity .7s ease}
#app.ready #gl{opacity:1}
.ui{position:absolute;inset:0;pointer-events:none;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* 로딩: 도면 격자 위에 대상지 경계선이 그려진다 */
.loader{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:
  linear-gradient(rgba(150,180,220,.06) 1px,transparent 1px) 0 0/24px 24px,
  linear-gradient(90deg,rgba(150,180,220,.06) 1px,transparent 1px) 0 0/24px 24px,var(--night);
  transition:opacity .6s ease .1s;pointer-events:none}
.loader svg{width:min(62vw,300px);height:auto;overflow:visible}
.loader .site{fill:none;stroke:var(--lime);stroke-width:5;stroke-linejoin:round;stroke-dasharray:3200;stroke-dashoffset:3200;animation:site 1.8s cubic-bezier(.6,0,.3,1) infinite alternate;filter:drop-shadow(0 0 6px rgba(207,220,74,.5))}
.loader .bank{fill:none;stroke:rgba(223,233,247,.35);stroke-width:2}
@keyframes site{to{stroke-dashoffset:0}}
#app.ready .loader{opacity:0}

/* 오프닝 안내 */
.hint{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 7vh);display:flex;flex-direction:column;align-items:center;gap:14px;
  color:var(--line);font-weight:300;font-size:15px;letter-spacing:.32em;text-indent:.32em;opacity:0;transition:opacity .6s ease}
.hint::after{content:"";width:1px;height:28px;background:linear-gradient(var(--line),transparent);animation:drip 2.2s ease-in-out infinite;transform-origin:top}
@keyframes drip{0%{transform:scaleY(0);opacity:0}30%{opacity:1}70%{transform:scaleY(1);opacity:.9}100%{transform:scaleY(1);opacity:0}}
#app.ready.idle .hint{opacity:.92}
#app:focus-visible .hint{outline:2px solid var(--accent);outline-offset:10px;border-radius:4px}
#app.playing .hint,#app.done .hint{opacity:0;transition-duration:.25s}

/* 세로 축하 문구 — 도면 선으로 윤곽이 그려진 뒤 아이보리로 채워진다 */
.wall{position:absolute;top:calc(env(safe-area-inset-top,0px) + clamp(30px,7vh,68px));right:max(22px,calc(env(safe-area-inset-right,0px) + 14px));
  display:flex;flex-direction:row-reverse;align-items:flex-start;gap:clamp(10px,3.2vw,18px);color:var(--ink)}
.headline{--fs:clamp(28px,10.2vw,46px);margin:0;display:flex;flex-direction:column;align-items:center;font-weight:400;font-size:var(--fs);line-height:1;gap:.13em}
.headline span{position:relative;display:block;color:transparent;transition:color .55s ease, text-shadow .8s ease;transition-delay:calc(var(--i) * .08s + .32s)}
.headline span::before{content:attr(data-c);position:absolute;left:0;top:0;color:transparent;-webkit-text-stroke:1px var(--line);
  clip-path:inset(0 0 100% 0);transition:clip-path .42s cubic-bezier(.6,0,.3,1), opacity .5s ease;transition-delay:calc(var(--i) * .08s), calc(var(--i) * .08s + .78s)}
.headline .dot{height:.46em;display:flex;align-items:center;justify-content:center;margin:-.04em 0}
.headline .dot::before{display:none}
.headline .dot i{display:block;width:calc(var(--fs) * .13);height:calc(var(--fs) * .13);border-radius:50%;box-sizing:border-box;border:1px solid transparent;background:transparent;
  transition:border-color .3s ease, background-color .55s ease;transition-delay:calc(var(--i) * .08s), calc(var(--i) * .08s + .32s)}
#app.celebrate .headline span{color:var(--ink);text-shadow:0 1px 18px rgba(0,0,0,.35)}
#app.celebrate .headline span::before{clip-path:inset(0 0 0 0);opacity:0}
#app.celebrate .headline .dot i{border-color:var(--line);background:var(--ink)}
.to{position:relative;margin:0;writing-mode:vertical-rl;text-orientation:upright;font-weight:600;letter-spacing:.32em;
  font-size:clamp(14px,4.3vw,19px);color:var(--accent);margin-top:calc(var(--fs, 40px) * 4.4);
  opacity:0;transform:translateY(-14px);transition:opacity .5s ease 1.05s,transform .7s cubic-bezier(.2,1.5,.4,1) 1.05s}
.to::before{content:"";position:absolute;left:50%;top:-14px;width:12px;height:3px;margin-left:-6px;background:var(--accent)}
.wall{--fs:clamp(28px,10.2vw,46px)}
#app.celebrate .to{opacity:1;transform:none}
#app.instant .headline span,#app.instant .headline span::before,#app.instant .headline .dot i,#app.instant .to{transition:none!important}

/* 컨트롤 */
.ctrl{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;justify-content:center;gap:10px;pointer-events:none}
.btn{pointer-events:auto;font:inherit;font-size:14px;letter-spacing:.14em;text-indent:.14em;min-height:44px;padding:0 18px;border-radius:999px;cursor:pointer;
  border:1px solid rgba(230,238,250,.28);background:var(--glass);color:var(--line);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  opacity:0;animation:fadein .6s ease .4s forwards;touch-action:manipulation}
#replay,#save{border-color:rgba(226,189,87,.42);color:var(--ink);animation-delay:1.4s}
.btn:focus-visible,.icon:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
@keyframes fadein{to{opacity:1}}
#app.instant #replay,#app.instant #save{animation-delay:.2s}
.icon{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:max(10px,calc(env(safe-area-inset-left,0px) + 6px));width:44px;height:44px;border-radius:50%;
  pointer-events:auto;cursor:pointer;border:0;background:transparent;color:var(--line);opacity:.62;display:grid;place-items:center;touch-action:manipulation}
.icon svg{width:22px;height:22px}
.icon[data-on="1"] .off,.icon[data-on="0"] .on{display:none}

/* 배경화면 시트 */
.sheet{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(8,8,8,.86);
  padding:calc(env(safe-area-inset-top,0px) + 20px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 20px) max(16px,env(safe-area-inset-left,0px));
  -webkit-user-select:auto;user-select:auto;-webkit-touch-callout:default;cursor:default;touch-action:auto}
.sheet img{max-height:68vh;max-width:86vw;border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.6);-webkit-touch-callout:default;pointer-events:auto}
.sheet p{margin:0;color:var(--ink);font-size:14px;letter-spacing:.06em;text-align:center;line-height:1.6}
.sheet .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.sheet .btn{opacity:1;animation:none;text-decoration:none;display:inline-flex;align-items:center}
.busy{position:fixed;inset:0;z-index:6;display:grid;place-items:center;background:rgba(8,8,8,.55);color:var(--ink);font-size:14px;letter-spacing:.14em}

/* 실패 시 대체 화면 */
#poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:none}
#app.fallback #gl,#app.fallback .loader,#app.fallback .hint,#app.fallback .icon{display:none}
#app.fallback .wall{display:none}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 46%,transparent 55%,rgba(0,0,0,.42) 100%);opacity:0;transition:opacity 1s}
#app.lowq.ready .vig{opacity:1}

@media (min-aspect-ratio: 23/20){
  .wall{--fs:clamp(36px,6.4vh,62px);top:50%;right:max(6vw,calc(env(safe-area-inset-right,0px) + 24px));transform:translateY(-52%);gap:clamp(16px,1.6vw,26px)}
  .headline{--fs:clamp(36px,6.4vh,62px)}
  .to{font-size:clamp(16px,2.3vh,22px)}
}
@media (max-height:600px) and (max-aspect-ratio: 4/5){
  .wall{--fs:clamp(26px,8.6vw,38px)}
  .headline{--fs:clamp(26px,8.6vw,38px)}
}
@media (prefers-reduced-motion: reduce){
  .hint::after,.loader .site{animation:none}
  .loader .site{stroke-dashoffset:0}
  .headline span,.headline span::before,.headline .dot i,.to{transition-duration:.01s!important;transition-delay:0s!important}
}
</style>

      s = Math.max(s, 1e-4); if (u.foam) g.scale.set(0.28 * s, 0.2 * s, 0.12 * s); else g.scale.setScalar(s); g.visible = k > 0.001;
    });
    var rp = eo(seg(t, 7.6, 8.5));
    var sway = 0.045 * Math.sin((t - 7.6) * 4.2) * Math.exp(-Math.max(0, t - 8.1) * 1.6) * (rp > 0 ? 1 : 0);
    setRibbon(rp, sway);
    setGyp(t);
    camAt(Math.max(0, t));
    setPost(t, L);
  }

  /* ---------- UI / timeline ---------- */
  var app = $('app'), skip = $('skip'), replay = $('replay'), save = $('save'), live = $('live'), soundBtn = $('sound');
  var state = 'idle', t0 = 0, raf = 0, textShown = false, curT = -1;
  var EMBED = (function () { try { return window.self !== window.top; } catch (e) { return true; } })();
  function render() { if (POST) POST.comp.render(); else renderer.render(scene, camera); }
  function say(msg) { live.textContent = ''; setTimeout(function () { live.textContent = msg; }, 60); }
  function showText(instant) {
    if (textShown) return; textShown = true;
    app.classList.toggle('instant', !!instant);
    app.classList.add('celebrate');
  }

  /* 사운드: 음원 없이 합성. 첫 터치 이후에만, 작게 */
  var AU = { ctx: null, out: null, on: true, nodes: [] };
  try { if (localStorage.getItem('hsb-sound') === 'off') AU.on = false; } catch (e) { }
  function syncSoundBtn() { soundBtn.setAttribute('data-on', AU.on ? '1' : '0'); soundBtn.setAttribute('aria-label', AU.on ? '소리 끄기' : '소리 켜기'); }
  syncSoundBtn();
  function audio() {
    if (REDUCE) return null;
    try {
      var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
      if (!AU.ctx) { AU.ctx = new AC(); AU.out = AU.ctx.createGain(); AU.out.gain.value = AU.on ? 0.55 : 0; AU.out.connect(AU.ctx.destination); }
      if (AU.ctx.state === 'suspended') AU.ctx.resume();
      return AU.ctx;
    } catch (e) { return null; }
  }
  function noise(ac, dur) { var b = ac.createBuffer(1, Math.ceil(ac.sampleRate * dur), ac.sampleRate), d = b.getChannelData(0); for (var i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; var s = ac.createBufferSource(); s.buffer = b; return s; }
  function env(ac, at, peak, a, d) { var g = ac.createGain(); g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(peak, at + a); g.gain.exponentialRampToValueAtTime(0.0001, at + a + d); g.connect(AU.out); return g; }
  function paper(ac, at) { var n = noise(ac, 0.7), f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.setValueAtTime(900, at); f.frequency.linearRampToValueAtTime(2600, at + 0.5); f.Q.value = 0.8; n.connect(f); f.connect(env(ac, at, 0.10, 0.08, 0.55)); n.start(at); AU.nodes.push(n); }
  function click(ac, at) { var n = noise(ac, 0.05), f = ac.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 1800; n.connect(f); f.connect(env(ac, at, 0.22, 0.002, 0.04)); n.start(at); var o = ac.createOscillator(); o.frequency.setValueAtTime(110, at); o.frequency.exponentialRampToValueAtTime(55, at + 0.12); o.connect(env(ac, at, 0.16, 0.004, 0.14)); o.start(at); o.stop(at + 0.2); AU.nodes.push(n, o); }
  function bell(ac, at, f0, vol, dec) { [1, 2.01, 3.02].forEach(function (m, i) { var o = ac.createOscillator(); o.type = 'sine'; o.frequency.value = f0 * m; o.connect(env(ac, at, vol / (i * 1.8 + 1), 0.015, dec / (i * 0.6 + 1))); o.start(at); o.stop(at + dec + 0.1); AU.nodes.push(o); }); }
  function schedule() {
    var ac = audio(); if (!ac) return; var t = ac.currentTime + 0.02;
    paper(ac, t + 0.05);
    click(ac, t + 5.9); click(ac, t + 6.25); click(ac, t + 6.6);
    [523.25, 659.25, 783.99, 880, 1046.5].forEach(function (f, i) { bell(ac, t + 7.12 + i * 0.13, f, 0.045, 2.6); });
    [1567.98, 2093, 1760].forEach(function (f, i) { bell(ac, t + 7.8 + i * 0.09, f, 0.016, 1.4); });
    [392, 523.25, 659.25].forEach(function (f) { bell(ac, t + 8.55, f, 0.03, 3.2); });
  }
  function stopSound() { AU.nodes.forEach(function (n) { try { n.stop(); } catch (e) { } }); AU.nodes = []; }
  soundBtn.addEventListener('click', function (e) {
    e.stopPropagation(); AU.on = !AU.on; syncSoundBtn();
    try { localStorage.setItem('hsb-sound', AU.on ? 'on' : 'off'); } catch (er) { }
    if (AU.ctx) AU.out.gain.setTargetAtTime(AU.on ? 0.55 : 0, AU.ctx.currentTime, 0.05);
  });
  soundBtn.addEventListener('pointerup', function (e) { e.stopPropagation(); });

  /* 재생 중 실측 프레임으로 자동 하향 */
  var perf = { last: 0, ema: 16, n: 0, cool: 0 };
  function degrade() {
    if (POST && Q.dof) { Q.dof = false; }
    else if (POST && Q.bloom) { Q.bloom = false; }
    else if (renderer.getPixelRatio() > 1) { renderer.setPixelRatio(1); layout(); }
    else if (POST) { POST = null; app.classList.add('lowq'); }
  }
  function watch(now, t) {
    if (perf.last) { var dt = now - perf.last; if (dt < 200) perf.ema = perf.ema * 0.9 + dt * 0.1; }
    perf.last = now; perf.n++;
    if (t > 1.2 && perf.n > 30 && now > perf.cool && perf.ema > 30) { degrade(); perf.cool = now + 1200; perf.ema = 20; }
  }

  function frame(now) {
    var t = (now - t0) / 1000; curT = t;
    apply(Math.min(t, END));
    render(); watch(now, t);
    if (t >= TEXT_T) showText(false);
    if (t >= END) { finish(); return; }
    raf = requestAnimationFrame(frame);
  }
  function start() {
    if (state !== 'idle') return;
    state = 'play'; app.classList.add('playing'); app.classList.remove('idle');
    skip.hidden = false; replay.hidden = true; save.hidden = true;
    perf.last = 0; perf.n = 0;
    if (AU.on) schedule(); else audio();
    t0 = performance.now(); raf = requestAnimationFrame(frame);
  }
  var amb = 0, ambT0 = 0, ambLast = 0;
  function ambient(now) { // 완성 후: 빛 속 먼지와 안개, 둘러보기
    if (state !== 'done') return;
    if (!document.hidden && now - ambLast > 33) {
      ambLast = now;
      if (!REDUCE) { window.__amb = (now - ambT0) / 1000; setAtmos(1, END); }
      if (!drag.on && now - ORBIT.last > 4000) { ORBIT.taz = 0; ORBIT.tel = 0; }
      ORBIT.az += (ORBIT.taz - ORBIT.az) * 0.12; ORBIT.el += (ORBIT.tel - ORBIT.el) * 0.12;
      camAt(END); setPost(END, 1); render();
    }
    amb = requestAnimationFrame(ambient);
  }
  function finish(instant) {
    cancelAnimationFrame(raf); state = 'done';
    if (instant) stopSound();
    apply(END); render(); showText(instant);
    cancelAnimationFrame(amb); ambT0 = performance.now(); amb = requestAnimationFrame(ambient);
    app.classList.remove('playing', 'idle'); app.classList.add('done');
    skip.hidden = true; replay.hidden = false; save.hidden = EMBED;
    say('완성되었습니다. 허씨가 보낸 화환 옆에, 허성빈의 졸업작품 〈대동의 숨결〉 모형이 놓여 있습니다. 축.졸업전시회.');
  }
  function reset() {
    cancelAnimationFrame(raf); cancelAnimationFrame(amb); window.__amb = 0; textShown = false; lastBoard = '';
    ORBIT.az = ORBIT.el = ORBIT.taz = ORBIT.tel = 0;
    app.classList.remove('celebrate', 'done', 'playing', 'instant'); app.classList.add('idle');
    replay.hidden = true; skip.hidden = true; save.hidden = true; state = 'idle';
    apply(-1); render();
  }

  /* 입력: 탭으로 시작, 완성 후 끌어서 모형 둘러보기 */
  var drag = { on: false, x: 0, y: 0, moved: false, id: null };
  app.addEventListener('pointerdown', function (e) {
    if (e.target.closest && e.target.closest('button')) return;
    drag.on = true; drag.moved = false; drag.x = e.clientX; drag.y = e.clientY; drag.az = ORBIT.taz; drag.el = ORBIT.tel; drag.id = e.pointerId;
    if (state === 'done') { try { app.setPointerCapture(e.pointerId); } catch (er) { } app.style.cursor = 'grabbing'; }
  });
  app.addEventListener('pointermove', function (e) {
    if (!drag.on || e.pointerId !== drag.id) return;
    var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (Math.abs(dx) + Math.abs(dy) > 8) drag.moved = true;
    if (state === 'done' && drag.moved && !REDUCE) { ORBIT.taz = clamp(drag.az - dx * 0.09, -12, 12); ORBIT.tel = clamp(drag.el + dy * 0.05, -5, 5); ORBIT.last = performance.now(); }
  });
  function endDrag(e) {
    if (!drag.on) return; drag.on = false; app.style.cursor = ''; ORBIT.last = performance.now();
    if (e.type === 'pointerup' && !drag.moved && state === 'idle') start();
  }
  app.addEventListener('pointerup', endDrag);
  app.addEventListener('pointercancel', endDrag);
  app.addEventListener('keydown', function (e) {
    if ((e.key === 'Enter' || e.key === ' ') && state === 'idle' && e.target === app) { e.preventDefault(); start(); }
    if (state === 'done' && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) { ORBIT.taz = clamp(ORBIT.taz + (e.key === 'ArrowLeft' ? 4 : -4), -12, 12); ORBIT.last = performance.now(); }
  });
  [skip, replay, save].forEach(function (b) { b.addEventListener('pointerdown', function (e) { e.stopPropagation(); }); b.addEventListener('pointerup', function (e) { e.stopPropagation(); }); });
  skip.addEventListener('click', function (e) { e.stopPropagation(); if (state === 'play') finish(true); });
  replay.addEventListener('click', function (e) { e.stopPropagation(); if (state !== 'done') return; stopSound(); reset(); setTimeout(start, 350); });
  var rz = 0;
  function onResize() { clearTimeout(rz); rz = setTimeout(function () { layout(); if (state !== 'play') { apply(state === 'done' ? END : -1); render(); } }, 120); }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', onResize);
  canvas.addEventListener('webglcontextlost', function (e) { e.preventDefault(); if (window.__fail) window.__fail(); });

  /* 배경화면 저장: 완성 장면을 1290×2796으로 다시 그리고 문구를 합성 */
  var sheet = $('sheet'), busy = $('busy'), wpImg = $('wp'), shareBtn = $('share'), dl = $('dl'), wpBlob = null, wpURL = '';
  function drawWallText(ctx, w, h) {
    var s = w / 430, fs = Math.min(46, 430 * 0.102) * s, x = w - 22 * s - fs / 2, y = h * 0.33, gap = fs * 0.13;
    ctx.fillStyle = '#efe6d6'; ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.font = '400 ' + fs + 'px Hahmlet, serif';
    ctx.shadowColor = 'rgba(0,0,0,0.35)'; ctx.shadowBlur = 18 * s;
    var chars = ['축', '.', '졸', '업', '전', '시', '회'], cy = y;
    chars.forEach(function (c) {
      if (c === '.') { var dh = fs * 0.46; ctx.beginPath(); ctx.arc(x, cy + dh / 2 - fs * 0.04, fs * 0.065, 0, 6.283); ctx.fill(); cy += dh - fs * 0.08 + gap; }
      else { ctx.fillText(c, x, cy); cy += fs + gap; }
    });
    ctx.shadowBlur = 0;
    var nfs = Math.min(19, 430 * 0.043) * s, nx = x - fs / 2 - 14 * s - nfs / 2, ny = y + fs * 4.4;
    ctx.fillStyle = '#e2bd57'; ctx.fillRect(nx - 6 * s, ny - 14 * s, 12 * s, 3 * s);
    ctx.font = '600 ' + nfs + 'px Hahmlet, serif';
    ['허', '성', '빈'].forEach(function (c, i) { ctx.fillText(c, nx, ny + i * nfs * 1.32); });
  }
  function makeWallpaper(done) {
    var WPW = 1290, WPH = 2796, prevPR = renderer.getPixelRatio(), keepPost = POST;
    renderer.setPixelRatio(1);
    layout(WPW, WPH, true);
    var saveAz = ORBIT.az, saveEl = ORBIT.el; ORBIT.az = ORBIT.el = 0;
    apply(END); setAtmos(1, END); render();
    var c2 = document.createElement('canvas'); c2.width = WPW; c2.height = WPH;
    var ctx = c2.getContext('2d'); ctx.drawImage(canvas, 0, 0, WPW, WPH); drawWallText(ctx, WPW, WPH);
    ORBIT.az = saveAz; ORBIT.el = saveEl; POST = keepPost;
    renderer.setPixelRatio(prevPR); layout(); apply(END); render();
    c2.toBlob(function (b) { done(b); }, 'image/jpeg', 0.92);
  }
  save.addEventListener('click', function (e) {
    e.stopPropagation(); busy.hidden = false;
    setTimeout(function () {
      try {
        makeWallpaper(function (b) {
          busy.hidden = true; if (!b) return;
          wpBlob = b; if (wpURL) URL.revokeObjectURL(wpURL); wpURL = URL.createObjectURL(b);
          wpImg.src = wpURL; dl.href = wpURL;
          var file = null; try { file = new File([b], 'heo-sungbin-graduation.jpg', { type: 'image/jpeg' }); } catch (er) { }
          var canShare = !!(file && navigator.canShare && navigator.canShare({ files: [file] }));
          shareBtn.hidden = !canShare; shareBtn._file = file;
          var touch = matchMedia('(pointer: coarse)').matches;
          dl.hidden = touch; $('wptip').textContent = touch ? '이미지를 길게 눌러 ‘사진에 저장’을 고르세요.' : '이미지를 내려받아 배경화면으로 쓰세요.';
          sheet.hidden = false; $('close').focus();
        });
      } catch (er) { busy.hidden = true; console.error(er); }
    }, 60);
  });
  shareBtn.addEventListener('click', function () { if (shareBtn._file) navigator.share({ files: [shareBtn._file], title: '축.졸업전시회 | 허성빈' }).catch(function () { }); });
  function closeSheet() { sheet.hidden = true; save.focus(); }
  $('close').addEventListener('click', closeSheet);
  sheet.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSheet(); });

  // 검수용: 특정 시점 렌더
  window.__seek = function (t) { cancelAnimationFrame(raf); cancelAnimationFrame(amb); textShown = false; apply(t); render(); if (t >= 0) app.classList.remove('idle'); if (t >= TEXT_T) app.classList.add('celebrate', 'instant'); else app.classList.remove('celebrate'); };

  /* ---------- boot ---------- */
  var fontsReady = document.fonts && document.fonts.load ? Promise.all([
    document.fonts.load('600 30px Hahmlet', '졸업설계 배치도 허성빈'), document.fonts.load('400 21px Hahmlet', '마스터플랜 허성빈 도시공학과 졸업작품 사업 대상지 1500m'),
    document.fonts.load('400 170px "Song Myung"', '허씨 대동의 숨결'), document.fonts.load('400 40px Hahmlet', '축.졸업전시회')
  ]).catch(function () { }) : Promise.resolve();
  var timeout = new Promise(function (r) { setTimeout(r, 2500); });
  Promise.race([fontsReady, timeout]).then(function () {
    drawBlueprintBase(bpBase.getContext('2d'), true);
    drawWood(woodC.getContext('2d'));
    paintRibbon(); ribbonTex.needsUpdate = true; paintPlaque(); plaqueTex.needsUpdate = true;
    layout();
    if (REDUCE) { finish(true); }
    else { apply(-1); render(); }
    app.classList.add('ready');
    window.__ready = true;
  });
})();

  }catch(e){ console.error(e); fail(); }
})();
